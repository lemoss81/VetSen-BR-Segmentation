# =====================================================================================
# VetSen-BR - config base (PSMT / Hydra).  Rodar da RAIZ do repo:
#   pytorch-smt --config-dir configs --config-name base_vetsenbr <overrides...>
#
# Overrides por run (os scripts de screening montam tudo):
#   paths.ds_root=<DS_ROOT> variant=<v> fold=f<f> seed=<s>
#   total_iters=<T> warmup_iters=<W> loss=<nome> model._target_=...
#
# 'fold' e um GRUPO (configs/fold/<f>.yaml), nao um numero solto: o arquivo traz o
# numero do fold E as estatisticas de banda do train daquele fold. Assim nao existe
# como rodar o fold 3 com a normalizacao do fold 0.
#
# MUDANCAS vs a v1.0 (backup em configs/base_vetsenbr.yaml.v1.bak):
#   - classes 6 -> 5. O dataset NAO tem nenhum pixel NoData (medido: 0 em 610.795.520
#     nas tres variantes), entao o canal 0 era peso morto. Os rotulos sao lidos de
#     labels/subclasses e remapeados para 0..4 pelo mask_class_mapping.
#     >>> A CLASSE 0 AGORA E WATER. Nenhum ignore_index em lugar nenhum. <<<
#   - bandas reordenadas para B04,B03,B02,... (RGB nas 3 primeiras) porque o smp
#     replica os filtros ImageNet ciclicamente (canal i herda o filtro i % 3).
#   - mean/std por FOLD, do train daquele fold (grupo fold/) - sem vazamento.
#   - encoder pre-treinado (imagenet) em vez de treino do zero.
#   - warmup linear + poly por ITERACAO, no lugar do ReduceLROnPlateau.
#   - sem EarlyStopping (o poly leva o LR a 0 em T; parar antes corta o cronograma).
#   - checkpoint pelo mIoU de validacao, nao pela loss (que muda de escala entre losses).
# =====================================================================================
defaults:
  - loss: dice_focal          # configs/loss/: dice_focal|focal|dice|dice_ce|ce|weighted_ce_<variante>_fold<f>
  - variant: forest_nonforest # configs/variant/: forest_nonforest|natural_cultivated
  - fold: f0                  # configs/fold/: f0..f4 - traz o numero do fold E as band stats dele
                              # o prefixo "f" e obrigatorio: Hydra recusa int em defaults e em override de grupo
  - _self_
  # _self_ vem por ultimo, entao nao defina 'fold', 'band_mean' nem 'band_std' abaixo:
  # isso sobreporia o grupo e reintroduziria a divergencia que ele existe para impedir.

paths:
  repo: ${hydra:runtime.cwd}
  ds_root: /ABSOLUTE/PATH/TO/dataset
seed: 42
run_name: ${variant}_fold${fold}_seed${seed}
deterministic_cudnn: true

# Cronograma de LR, por iteracao. Calculados pelo script de lancamento:
#   passos_por_epoca = floor(n_train / batch_size)        (drop_last: true)
#   total_iters      = epochs * passos_por_epoca
#   warmup_iters     = round(0.01 * total_iters)
# Conferir no smoke test: trainer.estimated_stepping_batches == total_iters
total_iters: 7500
warmup_iters: 75

model:
  _target_: segmentation_models_pytorch.Unet   # ou DeepLabV3Plus, ou Segformer
  encoder_name: resnet101                      # com Segformer, usar mit_b3
  encoder_weights: imagenet                    # smp replica os filtros RGB (i % 3) e reescala por 3/10
  in_channels: 10
  classes: ${hyperparameters.classes}
  activation: null

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.6e-4                 # sobrescrito pelo screening de LR
  weight_decay: 0.01         # PENDENTE DE DECISAO (0.01 = receita SegFormer/mmseg; a v1 usava 1e-4)
  eps: 1.0e-8

scheduler_list:
  - scheduler:
      _target_: custom_sched.poly_warmup.PolyWarmupLR
      total_iters: ${total_iters}
      warmup_iters: ${warmup_iters}
      power: 1.0
    interval: step           # por ITERACAO (o PSMT repassa este dict ao Lightning)
    frequency: 1
    name: poly_warmup
    # sem 'monitor': so o ReduceLROnPlateau usa isso.
# NAO definir hyperparameters.warmup_epochs: o PSMT envelopa o scheduler num
# LinearLR(start_factor=1e-2)+SequentialLR quando esse campo e > 0 -> warmup duplo.

hyperparameters:
  batch_size: 128
  epochs: 150                # orcamento fixo; travar apos o piloto de 3 runs
  classes: 5                 # 0=Water 1=Built-up 2=veg 3=veg 4=Barren Land - sem NoData

pl_trainer:
  max_epochs: ${hyperparameters.epochs}
  accelerator: auto
  devices: 1
  precision: 16-mixed
  log_every_n_steps: 50
  deterministic: warn        # True quebra a CE ponderada (nll_loss2d sem kernel deterministico)

# Sem ignore_index: a classe 0 e Water e o dataset nao tem NoData.
metrics:
  - _target_: torchmetrics.JaccardIndex
    task: multiclass
    num_classes: ${hyperparameters.classes}
    average: macro
  - _target_: torchmetrics.Accuracy
    task: multiclass
    num_classes: ${hyperparameters.classes}
    average: macro
  - _target_: torchmetrics.F1Score
    task: multiclass
    num_classes: ${hyperparameters.classes}
    average: macro
  - _target_: torchmetrics.Precision
    task: multiclass
    num_classes: ${hyperparameters.classes}
    average: macro
  - _target_: torchmetrics.Recall
    task: multiclass
    num_classes: ${hyperparameters.classes}
    average: macro

logger:
  - _target_: pytorch_lightning.loggers.TensorBoardLogger
    save_dir: ${paths.repo}/experiments
    name: ${run_name}
  - _target_: pytorch_lightning.loggers.WandbLogger
    project: vetsenbr-segmentation-benchmark
    name: ${run_name}
    save_dir: ${paths.repo}/experiments
    log_model: false

callbacks:
  # O MetricCollection e clonado com postfix="/val" -> a chave e "<Classe>/val",
  # NAO "val/<Classe>". Conferir no smoke test com trainer.callback_metrics.keys().
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: MulticlassJaccardIndex/val
    mode: max
    save_top_k: 1
    save_last: true
    filename: best-{epoch:02d}
    auto_insert_metric_name: false
    dirpath: ${paths.repo}/experiments/${run_name}/checkpoints
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: step
  # Sem EarlyStopping: o orcamento E e fixo e o poly precisa chegar ao fim.

train_dataset:
  _target_: pytorch_segmentation_models_trainer.dataset_loader.dataset.SegmentationDataset
  input_csv_path: ${paths.repo}/splits/csv_derived/${variant}/fold${fold}/train.csv
  root_dir: ${paths.ds_root}
  seed: ${seed}
  n_classes: ${hyperparameters.classes}
  mask_class_mapping: ${mask_class_mapping}     # subclasses 1..10 -> 0..4 desta variante
  use_rasterio: true
  selected_bands: [3, 2, 1, 4, 5, 6, 7, 8, 9, 10]   # 1-based: B04,B03,B02,B08,B05,B06,B07,B8A,B11,B12
  image_dtype: uint16
  augmentation_list:
    - _target_: albumentations.ToFloat
      max_value: 65535.0
    - _target_: albumentations.HorizontalFlip
      p: 0.5
    - _target_: albumentations.VerticalFlip
      p: 0.5
    - _target_: albumentations.RandomBrightnessContrast
      brightness_limit: 0.2
      contrast_limit: 0.2
      p: 0.5
    - _target_: albumentations.Normalize
      mean: ${band_mean}
      std: ${band_std}
      max_pixel_value: 1.0
    - _target_: albumentations.pytorch.ToTensorV2
  data_loader:
    shuffle: true
    num_workers: 12
    pin_memory: true
    persistent_workers: true
    batch_size: ${hyperparameters.batch_size}
    drop_last: true

val_dataset:
  _target_: pytorch_segmentation_models_trainer.dataset_loader.dataset.SegmentationDataset
  input_csv_path: ${paths.repo}/splits/csv_derived/${variant}/fold${fold}/val.csv
  root_dir: ${paths.ds_root}
  seed: ${seed}
  n_classes: ${hyperparameters.classes}
  mask_class_mapping: ${mask_class_mapping}
  use_rasterio: true
  selected_bands: [3, 2, 1, 4, 5, 6, 7, 8, 9, 10]
  image_dtype: uint16
  augmentation_list:
    - _target_: albumentations.ToFloat
      max_value: 65535.0
    - _target_: albumentations.Normalize
      mean: ${band_mean}
      std: ${band_std}
      max_pixel_value: 1.0
    - _target_: albumentations.pytorch.ToTensorV2
  data_loader:
    shuffle: false
    num_workers: 12
    pin_memory: true
    persistent_workers: true
    batch_size: ${hyperparameters.batch_size}
    drop_last: false

mode: train
