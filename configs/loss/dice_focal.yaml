# @package _global_
# 0.25*Dice + 0.75*Focal (gamma=2) — ablation winner
loss_params:
  compound_loss:
    normalize_losses: false
    losses:
      - loss:
          _target_: segmentation_models_pytorch.losses.DiceLoss
          mode: multiclass
          ignore_index: 0
        weight: 0.25
      - loss:
          _target_: segmentation_models_pytorch.losses.FocalLoss
          mode: multiclass
          ignore_index: 0
        weight: 0.75
