# @package _global_
# Weighted CE (label smoothing 0.1) — pesos do TRAIN do fold 3 de forest_nonforest.
# Inverso da raiz da frequencia, normalizado pela media. Rotulos remapeados 1..5 -> 0..4,
# entao sao 5 pesos e NAO existe ignore_index (a classe 0 e Water, nao NoData).
# ordem: 0=Water, 1=Built-up, 2=Forest, 3=Non-forest, 4=Barren
# frequencias (% do train): Water=2.1917, Built-up=4.3754, Forest=32.5064, Non-forest=60.4147, Barren=0.5119
loss:
  _target_: custom_losses.weighted_dice_ce.WeightedDiceCrossEntropyLoss
  num_classes: ${hyperparameters.classes}
  dice_weight: 0.0
  ce_weight: 1.0
  smooth_factor: 0.1
  class_weights: [1.182839, 0.837160, 0.307137, 0.225292, 2.447572]
