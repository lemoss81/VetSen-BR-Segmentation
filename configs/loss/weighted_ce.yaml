# @package _global_
# Weighted CE (label smoothing 0.1) — weights = inverse square-root frequency, normalized.
# class_weights = [NoData, Water, Built-up, veg3, veg4, Bare Soil]  (6 channels; idx0 ignored).
# Values below are for forest_nonforest (used in RUN 1).
#   natural_cultivated:  [1.0, 1.1959, 0.8501, 0.2198, 0.2706, 2.4637]  <-- swap if running on NC
loss:
  _target_: pytorch_segmentation_models_trainer.custom_losses.loss.WeightedDiceCrossEntropyLoss
  num_classes: ${hyperparameters.classes}
  dice_weight: 0.0
  ce_weight: 1.0
  smooth_factor: 0.1
  ignore_index: 0
  class_weights: [1.0, 1.1932, 0.8482, 0.2905, 0.2100, 2.4582]
