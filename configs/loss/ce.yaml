# @package _global_
# Sem ignore_index: classes 5 (0..4) e a classe 0 e Water, nao NoData.
# CE only (label smoothing 0.1), no class weights
loss:
  _target_: pytorch_segmentation_models_trainer.custom_losses.loss.WeightedDiceCrossEntropyLoss
  num_classes: ${hyperparameters.classes}
  dice_weight: 0.0
  ce_weight: 1.0
  smooth_factor: 0.1
